name: windows-ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      - name: Restore
        run: dotnet restore WindowsClientCenter.sln

      - name: Verify third-party package inventory
        shell: pwsh
        run: |
          ./scripts/generate-third-party-package-notices.ps1
          git diff --exit-code -- docs/third-party-nuget-packages.md

      - name: Build
        run: dotnet build WindowsClientCenter.sln -c Release --no-restore -warnaserror

      - name: Run Plugin.Host tests
        run: dotnet test tests/Plugin.Host.Tests/Plugin.Host.Tests.csproj -c Release --no-build

      - name: Run Host.Wpf tests
        run: dotnet test tests/Host.Wpf.Tests/Host.Wpf.Tests.csproj -c Release --no-build

      - name: Run Intune.Services tests
        run: dotnet test tests/Intune.Services.Tests/Intune.Services.Tests.csproj -c Release --no-build

      - name: Run Plugins.BitLockerAgent tests
        run: dotnet test tests/Plugins.BitLockerAgent.Tests/Plugins.BitLockerAgent.Tests.csproj -c Release --no-build

      - name: Run Plugins.DeviceOverview tests
        run: dotnet test tests/Plugins.DeviceOverview.Tests/Plugins.DeviceOverview.Tests.csproj -c Release --no-build

      - name: Run Plugins.DeviceActions tests
        run: dotnet test tests/Plugins.DeviceActions.Tests/Plugins.DeviceActions.Tests.csproj -c Release --no-build

      - name: Run Plugins.IntuneAgent tests
        run: dotnet test tests/Plugins.IntuneAgent.Tests/Plugins.IntuneAgent.Tests.csproj -c Release --no-build

      - name: Run Plugins.PowerShellScripts tests
        run: dotnet test tests/Plugins.PowerShellScripts.Tests/Plugins.PowerShellScripts.Tests.csproj -c Release --no-build

      - name: Run Plugins.WindowsDefenderAgent tests
        run: dotnet test tests/Plugins.WindowsDefenderAgent.Tests/Plugins.WindowsDefenderAgent.Tests.csproj -c Release --no-build

      - name: Run Plugins.WindowsUpdateAgent tests
        run: dotnet test tests/Plugins.WindowsUpdateAgent.Tests/Plugins.WindowsUpdateAgent.Tests.csproj -c Release --no-build

      - name: Run SCCM automation compatibility tests
        run: dotnet test tests/SccmCliCtr.Automation.Tests/SccmCliCtr.Automation.Tests.csproj -c Release --no-build

      - name: Stage native plugins
        shell: pwsh
        run: ./scripts/stage-native-plugins.ps1 -Configuration Release

      - name: Build package layout
        shell: pwsh
        run: ./build/package-layout.ps1 -Configuration Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WindowsClientCenter-artifacts
          path: artifacts/**

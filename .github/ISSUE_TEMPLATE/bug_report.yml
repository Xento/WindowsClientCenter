name: Bug report
description: Report a reproducible bug in the desktop app, runtime services, or plugin workflows.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact host context, plugin, and action path when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Logs or screenshots
      description: Please redact any tenant names, usernames, or internal hostnames before attaching artifacts.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, .NET SDK version, and whether you ran in Mock, Demo, or Live mode.
